name: Crave Builder Existing

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Crave Target Build Commands'
        required: true
        default: 'crave run -- "echo Hello"'

jobs:
  crave_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crave CLI (Fixed Path)
        run: |
          # Official Crave Binary ကို ဒေါင်းလုဒ်ဆွဲပြီး Global Path ထဲ တိုက်ရိုက်ထည့်ခြင်း
          curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave/master/get_crave.sh
          chmod +x crave
          sudo mv crave /usr/local/bin/crave

      - name: Configure Crave Credentials
        run: |
          mkdir -p $HOME/.crave
          echo '{
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }' > $HOME/.crave/crave.conf

      - name: Execute Crave Command
        run: |
          # ကွက်လပ်ထဲက ရိုက်ထည့်လိုက်တဲ့ Command ကို စတင် Run ခြင်း
          ${{ github.event.inputs.command }}
