name: Crave ROM Builder (Final Running)

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Crave Credentials
        run: |
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Install Official Crave CLI
        run: |
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          if [ -f crave ]; then
            chmod +x crave
            sudo mv crave /usr/local/bin/crave
          fi

      - name: Execute Crave Build Command
        run: |
          # သတ်မှတ်ချက်အတိုင်း ROM စတင် Build ခြင်း
          crave run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --git-lfs && repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && source build/envsetup.sh && breakfast lavender && mka bacon"

      - name: Download Built ROM from Crave (Pull)
        run: |
          mkdir -p signed-files
          crave pull out/target/product/lavender/lineage-17.1-*.zip || crave pull out/target/product/lavender/*.zip || true
          mv out/target/product/lavender/*.zip ./signed-files/ || true
          ls -la ./signed-files/

      - name: Upload ROM to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lavender-Q-${{ github.run_number }}
          name: "LineageOS 17.1 for Redmi Note 7 (lavender)"
          body: |
            ---
            **Android Version:** 10 (Q)
            **Device Codename:** lavender
            **Status:** Success 🚀
          files: ./signed-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
