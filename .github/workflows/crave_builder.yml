name: Crave Builder Android 10 redmi note 7 with Auto Release

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Official Crave CLI
        run: |
          # 1. 404 Error မတက်စေရန် တရားဝင် GitHub Release ရဲ့ အလုပ်လုပ်သော Link မှ တိုက်ရိုက်ဆွဲချခြင်း
          curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave-cli/main/get_crave.sh && bash get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh
          
          # တကယ်လို့ အပေါ်ကမရရင် တိုက်ရိုက် binary ကို အောက်ပါအတိုင်း ဆွဲယူပါမည်
          if [ ! -f crave ] || [ "$(cat crave | grep -c '404')" -gt 0 ]; then
            echo "Switching to direct stable binary link..."
            curl -sLo crave https://github.com/craveofficial/crave-cli/releases/latest/download/crave-linux-amd64 || curl -sLo crave https://github.com/accupara/crave/releases/latest/download/crave
          fi
          
          # 2. မောင်းနှင်ခွင့်ပေးပြီး Global Path သို့ ပို့ဆောင်ခြင်း
          chmod +x crave
          sudo mv crave /usr/local/bin/crave
          
          # 3. ဗားရှင်း အောင်မြင်စွာ ထွက်မထွက် အရင် စစ်ဆေးခြင်း
          crave version

      - name: Configure Crave Credentials
        run: |
          # 4. Config ဖိုင် တည်ဆောက်ခြင်း
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Execute Crave Build Command
        run: |
          # 5. သတ်မှတ်ချက်အတိုင်း ROM စတင် Build ခြင်း
          crave --config /home/runner/.crave/crave.conf run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --git-lfs && repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && source build/envsetup.sh && breakfast lavender && mka bacon"

      - name: Download Built ROM from Crave (Pull)
        run: |
          mkdir -p signed-files
          crave --config /home/runner/.crave/crave.conf pull out/target/product/lavender/lineage-17.1-*.zip || crave --config /home/runner/.crave/crave.conf pull out/target/product/lavender/*.zip || true
          mv out/target/product/lavender/*.zip ./signed-files/ || true
          ls -la ./signed-files/

      - name: Upload ROM to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lavender-Q-${{ github.run_number }}
          name: "LineageOS 17.1 for Redmi Note 7 (lavender)"
          body: |
            ---
            **Android Version:** 10 (Q)
            **Device Codename:** lavender
            **Developer:** MgMgWinGyi
            **Status:** Success 🚀
          files: ./signed-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
