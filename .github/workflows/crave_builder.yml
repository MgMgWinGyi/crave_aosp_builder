name: Crave Builder Android 10 redmi note 7 with Auto Release

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crave CLI
        run: |
          curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave/master/get_crave.sh
          chmod +x crave
          # စက်ထဲမှာ သိမ်းဆည်းထားခြင်း
          sudo cp crave /usr/local/bin/crave
          sudo mv crave /usr/bin/crave

      - name: Configure Crave Credentials (Fixed Path)
        run: |
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Execute Crave Build Command
        run: |
          # လက်ရှိ လမ်းကြောင်းအမှန်အတိုင်း အတင်းခိုင်းစေခြင်း
          /usr/bin/crave --config /home/runner/.crave/crave.conf run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --git-lfs && repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && source build/envsetup.sh && breakfast lavender && mka bacon"

      - name: Download Built ROM from Crave (Pull)
        run: |
          mkdir -p signed-files
          /usr/bin/crave --config /home/runner/.crave/crave.conf pull out/target/product/lavender/lineage-17.1-*.zip || /usr/bin/crave --config /home/runner/.crave/crave.conf pull out/target/product/lavender/*.zip || true
          mv out/target/product/lavender/*.zip ./signed-files/ || true
          ls -la ./signed-files/

      - name: Upload ROM to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lavender-Q-${{ github.run_number }}
          name: "LineageOS 17.1 for Redmi Note 7 (lavender)"
          body: |
            ---
            **Android Version:** 10 (Q)
            **Device Codename:** lavender
            **Developer:** MgMgWinGyi
            **Status:** Success 🚀
          files: ./signed-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
