name: Crave Builder Android 10 redmi note 7 with Auto Release

on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Crave Credentials
        run: |
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Install Official Crave CLI
        run: |
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          if [ -f crave ]; then
            chmod +x crave
            sudo mv crave /usr/local/bin/crave
          fi

      - name: Verify Crave Version & Safe Check
        run: |
          # တကယ်လို့ အကောင့်မှားရင် လဲမကျသွားဘဲ error အတင်းထုတ်ပြခိုင်းခြင်း
          crave version || echo "Crave Tool: Verification Failed due to wrong configuration/credentials!"

      - name: Execute Crave Build Command
        run: |
          # အထက်ပါအဆင့် အောင်မြင်မှသာ အလုပ်လုပ်မည်
          crave run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --git-lfs && repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && source build/envsetup.sh && breakfast lavender && mka bacon"
