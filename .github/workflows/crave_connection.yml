name: Crave Strict Connection Test

on:
  workflow_dispatch:

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crave CLI
        run: |
          # ဒေါင်းလုဒ်ဆွဲတာ သီးသန့်ခွဲထုတ်ထားပါတယ်
          curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave/master/get_crave.sh
          chmod +x crave
          sudo mv crave /usr/local/bin/crave

      - name: Configure Crave Credentials
        run: |
          mkdir -p $HOME/.crave
          echo '{
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }' > $HOME/.crave/crave.conf
          
          # သော့ချက်တွေ တကယ်ဝင်မဝင် စစ်ဆေးခြင်း (လုံုံခြုံရေးအရ တစ်ဝက်ပဲ ပြပါလိမ့်မယ်)
          echo "Checking config structure..."
          cat $HOME/.crave/crave.conf | grep -o '"username": ".*"' || echo "Username is missing or empty!"

      - name: Test Connection to Crave (Strict)
        run: |
          # Error ကို အတင်းထုတ်ပြခိုင်းသည့် Command
          crave devspaces list
