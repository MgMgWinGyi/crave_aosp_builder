name: Crave Forced Error Capture

on:
  workflow_dispatch:

jobs:
  debug_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crave CLI
        run: |
          curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave/master/get_crave.sh
          chmod +x crave

      - name: Configure Crave Credentials
        run: |
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF

      - name: Force Crave To Speak (Print Version & Help)
        run: |
          # Tool ကိုယ်တိုင် အလုပ်လုပ်ပုံကို စစ်ဆေးခြင်း
          ./crave version
          
          echo "=== Attempting to run with config and print internal errors ==="
          # Config ကို တိုက်ရိုက်ဆွဲဖတ်ပြီး version စစ်ခိုင်းခြင်းဖြင့် error ရှာခြင်း
          ./crave --config /home/runner/.crave/crave.conf version || echo "Crave Crashed!"
