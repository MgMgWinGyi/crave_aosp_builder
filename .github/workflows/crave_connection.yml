name: Crave Ultimate Diagnostics Test

on:
  workflow_dispatch:

jobs:
  diagnose_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crave CLI
        run: |
          curl -sLo crave https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh || curl -sLo crave https://raw.githubusercontent.com/craveofficial/crave/master/get_crave.sh
          chmod +x crave
          sudo mv crave /usr/local/bin/crave

      - name: Hardcode Crave Config (Direct Path)
        run: |
          # လမ်းကြောင်းကို $HOME မသုံးဘဲ တိုက်ရိုက် လမ်းကြောင်းအပြည့်အစုံနဲ့ ဆောက်ခိုင်းခြင်း
          mkdir -p /home/runner/.crave
          cat << 'EOF' > /home/runner/.crave/crave.conf
          {
            "username": "${{ secrets.CRAVE_USERNAME }}",
            "auth": "${{ secrets.CRAVE_TOKEN }}"
          }
          EOF
          
          # ဖိုင်တကယ်ရှိမရှိ စစ်ဆေးခြင်း
          echo "=== Checking config file location ==="
          ls -la /home/runner/.crave/crave.conf
          
          echo "=== Checking if config is empty ==="
          cat /home/runner/.crave/crave.conf | grep -q "${{ secrets.CRAVE_USERNAME }}" && echo "Config Status: Loaded Successfully" || echo "Config Status: EMPTY (Secrets Missing!)"

      - name: Run Crave with Debug Mode
        run: |
          # Config ဖိုင် လမ်းကြောင်းကို အတင်းညွှန်ပြပြီး Debug (အမှားရှာ) စနစ်ဖြင့် Run ခြင်း
          crave --config /home/runner/.crave/crave.conf devspaces list
